<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Temporarily closed · Paddock Legacy</title>
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='icons/favicon-32.png') }}">
  <meta name="theme-color" content="#0e1a2b">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/fonts.css') }}">
  <style>
    :root { color-scheme: dark; --navy: #0e1a2b; --navy-2: #13233a; --navy-line: #263a59; --ground: #0b1320;
      --surface: #111b2b; --edge: #26354f; --ink: #e9eef6; --sub: #95a2b6; --orange: #f4581c; --orange-btn: #cf4a0b;
      --orange-ink: #ff8a57; --orange-soft: #2b1a12; --orange-line: #6b3115;
      --font-display: "Barlow Semi Condensed", "Arial Narrow", "Segoe UI", system-ui, sans-serif;
      --font-body: "Barlow", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; background: var(--ground);
      color: var(--ink); font-family: var(--font-body); font-size: 15.5px; line-height: 1.5; }
    .appbar { background: var(--navy); border-bottom: 4px solid var(--orange); padding: 14px 16px; }
    .brand { display: inline-flex; align-items: center; gap: 10px; color: #fff; }
    .brand svg { width: 48px; height: 30px; }
    .brand strong { font-family: var(--font-display); font-weight: 800; font-size: 1.15rem; letter-spacing: .02em; text-transform: uppercase; }
    .wrap { flex: 1; display: grid; place-items: center; padding: 24px 16px; }
    main { width: 100%; max-width: 560px; background: var(--surface); border: 1px solid var(--edge); border-radius: 10px;
      padding: 32px 28px; box-shadow: 0 14px 34px -12px rgba(0, 0, 0, .6); }
    .kicker { font-family: var(--font-display); font-weight: 700; font-size: .85rem; letter-spacing: .1em;
      text-transform: uppercase; color: var(--orange-ink); margin: 0 0 6px; }
    h1 { font-family: var(--font-display); font-weight: 800; font-size: 2rem; line-height: 1.1; margin: 0 0 14px; }
    p { margin: 0 0 16px; color: var(--sub); }
    .message { color: var(--ink); font-size: 1.05rem; white-space: pre-line; }
    .reopen { display: inline-block; padding: 8px 14px; border-radius: 6px; background: var(--orange-soft);
      border: 1px solid var(--orange-line); color: var(--orange-ink); font-weight: 600; margin-bottom: 20px; }
    .actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 8px; }
    button, .link { min-height: 44px; padding: 10px 18px; border-radius: 6px; font: inherit; font-weight: 600; cursor: pointer; }
    button { background: var(--orange-btn); color: #fff; border: 1px solid var(--orange-btn); }
    button:hover { background: #b8410a; }
    .link { color: var(--ink); border: 1px solid var(--edge); text-decoration: none; display: inline-flex; align-items: center; }
    .link:hover { border-color: var(--sub); }
    button:focus-visible, .link:focus-visible { outline: 3px solid var(--orange); outline-offset: 2px; }
    small { display: block; margin-top: 20px; color: var(--sub); font-size: .85rem; }
  </style>
</head>
<body>
<header class="appbar">
  <span class="brand"><svg viewBox="0 0 48 30" aria-hidden="true"><g transform="translate(5 0) skewX(-12)"><path fill="currentColor" fill-rule="evenodd" d="M3 27V3h12.5a7.6 7.6 0 0 1 0 15.2H9.4V27zm6.4-18.7v4.6h5.5a2.3 2.3 0 0 0 0-4.6z"/><path fill="currentColor" d="M22 3h6.4v18.4H38V27H22z"/><path fill="#f4581c" d="M31 3h12l-1.6 5.3H31z"/></g></svg><strong>Paddock Legacy</strong></span>
</header>
<div class="wrap">
<main>
  <p class="kicker">Maintenance</p>
  <h1>The paddock is temporarily closed</h1>
  <p class="message">{{ message }}</p>
  {% if expected_end %}<p class="reopen">Expected to reopen <time datetime="{{ expected_end }}" id="reopen">{{ expected_end|replace('T', ' ')|replace('+00:00', ' UTC') }}</time></p>{% endif %}
  <div class="actions">
    <button type="button" id="refresh">Check again</button>
    <a class="link" href="{{ url_for('login') }}">Site owner sign in</a>
  </div>
  <small aria-live="polite" id="auto">This page checks again automatically every two minutes.</small>
</main>
</div>
<script>
(function () {
  var t = document.getElementById("reopen");
  if (t) { try { t.textContent = new Date(t.getAttribute("datetime")).toLocaleString([], { weekday: "short", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }); } catch (e) {} }
  function again() { window.location.replace(window.location.pathname === "/maintenance" ? "/" : window.location.href); }
  document.getElementById("refresh").addEventListener("click", again);
  setTimeout(again, 120000);
})();
</script>
</body>
</html>
